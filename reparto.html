<style>
:root{--navy:#1F344C;--navy-2:#2B4766;--navy-suave:#EDF1F6;--papel:#fff;--fondo:#F3F5F8;--tinta:#16202B;--gris:#667085;--gris-2:#98A2B3;--filo:#E4E7EC;--verde:#1F7A55;--verde-suave:#E8F4EE;--rojo:#B42318;--rojo-suave:#FDEDEB;--oro:#B7862C;--oro-suave:#FBF4E6;--sombra:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);--r:12px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--fondo);color:var(--tinta);min-height:100vh;max-width:640px;margin:0 auto;font-size:14px;line-height:1.4;padding-bottom:calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased;}
svg.i{width:18px;height:18px;flex:none;vertical-align:-4px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
header{background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px rgba(16,24,40,.18);}
header .fila{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.marca{display:flex;align-items:center;gap:10px;}
.marca .logo{width:34px;height:34px;border-radius:9px;background:#fff;color:var(--navy);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;letter-spacing:-.02em;}
.marca .sub{font-size:11px;opacity:.7;letter-spacing:.06em;text-transform:uppercase;}
header h1{font-size:16px;color:#fff;font-weight:600;line-height:1.2;}
header #bMenu{background:rgba(255,255,255,.12);border:0;color:#fff;width:40px;height:40px;padding:0;border-radius:10px;font-size:20px;display:flex;align-items:center;justify-content:center;}
.fecha{display:flex;align-items:center;gap:6px;margin-top:12px;background:rgba(255,255,255,.1);border-radius:10px;padding:4px;}
.fecha button{border:0;background:transparent;border-radius:8px;width:38px;height:34px;font-size:18px;color:#fff;font-family:inherit;}
.fecha button:active{background:rgba(255,255,255,.15);}
.fecha .dia{flex:1;text-align:center;font-weight:600;color:#fff;font-size:14px;}
.fecha #fHoy{width:auto;padding:0 12px;font-size:12.5px;font-weight:600;background:#fff;color:var(--navy);}
main{padding:14px 14px 0;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:10px 14px;font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--filo);border-radius:10px;cursor:pointer;background:var(--papel);color:var(--navy);box-shadow:0 1px 2px rgba(16,24,40,.05);transition:background .12s,transform .08s;text-decoration:none;}
.btn:active{transform:scale(.98);}
.btn.primario{background:var(--navy);border-color:var(--navy);color:#fff;}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff;}
.btn.peligro{border-color:#F4C7C2;color:var(--rojo);background:#fff;}
.btn.peq{min-height:38px;padding:7px 11px;font-size:13px;border-radius:9px;}
.btn:disabled{opacity:.5;}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0;}
.fila-btn .btn{flex:1 1 auto;}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid #D0D5DD;border-radius:10px;padding:11px 12px;background:var(--papel);color:var(--tinta);width:100%;box-shadow:0 1px 2px rgba(16,24,40,.04);}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--navy-2);box-shadow:0 0 0 3px rgba(43,71,102,.15);}
label{font-size:11.5px;font-weight:600;color:var(--gris);display:block;margin:16px 0 6px;text-transform:uppercase;letter-spacing:.05em;}
.nota{font-size:12.5px;color:var(--gris);margin:6px 0;}
.alerta{border:1px solid #F0DDB5;background:var(--oro-suave);border-radius:10px;padding:10px 12px;font-size:13px;margin:10px 0;color:#6B4E14;}
.alerta.ok{border-color:#BFE0CF;background:var(--verde-suave);color:#14543A;}
.alerta.mal{border-color:#F4C7C2;background:var(--rojo-suave);color:#7A1A12;}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:4px 0 14px;background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);overflow:hidden;}
.resumen div{padding:12px 8px;text-align:center;border-left:1px solid var(--filo);}
.resumen div:first-child{border-left:0;}
.resumen b{display:block;font-size:19px;color:var(--navy);font-family:'IBM Plex Mono',monospace;font-weight:600;}
.resumen span{font-size:11px;color:var(--gris);text-transform:uppercase;letter-spacing:.04em;}
.card{position:relative;background:var(--papel);border:1px solid var(--filo);border-radius:var(--r);padding:13px 14px 13px 18px;margin-bottom:10px;box-shadow:var(--sombra);overflow:hidden;}
.card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--oro);}
.card.hecha::before{background:var(--verde);}
.card.hecha{background:#FCFDFC;}
.card.inc::before{background:var(--rojo);}
.card .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer;}
.card .cli{font-weight:600;font-size:15.5px;color:var(--tinta);}
.card .dir{font-size:12.5px;color:var(--gris);margin-top:3px;}
.card .imp{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;white-space:nowrap;color:var(--navy);}
.card .acc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.card .acc a{flex:1 1 0;white-space:nowrap;}
.card .acc button[aria-label]{flex:0 0 46px;padding:0;}
.card .acc .primario{flex:1 1 100%;min-height:46px;font-size:15px;}
.card .acc a,.card .acc button{text-align:center;text-decoration:none;}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--navy-suave);color:var(--navy);margin:2px 4px 2px 0;}
.tag.fac{background:var(--oro-suave);color:#7A5A16;}
.tag.ok{background:var(--verde-suave);color:var(--verde);}
.tag.mal{background:var(--rojo-suave);color:var(--rojo);}
h2{font-size:12.5px;color:var(--navy);text-transform:uppercase;letter-spacing:.06em;margin:20px 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;}
h2>span:first-child{cursor:pointer;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px;}
th{text-align:right;font-size:10.5px;color:var(--gris);font-weight:600;padding:6px 4px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1px solid var(--filo);}
td{padding:7px 4px;border-top:1px solid var(--filo);text-align:right;font-family:'IBM Plex Mono',monospace;}
th:first-child,td:first-child{text-align:left;} td.txt{font-family:'IBM Plex Sans',sans-serif;text-align:left;}
tr:last-child td{border-top:2px solid var(--tinta);}
.velo{position:fixed;inset:0;background:rgba(16,24,40,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fd .15s ease;}
.hoja{background:var(--papel);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:18px 18px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(16,24,40,.2);animation:su .2s ease;}
.hoja::before{content:'';display:block;width:40px;height:4px;border-radius:4px;background:#D0D5DD;margin:0 auto 14px;}
.hoja h3{font-size:18px;color:var(--tinta);margin-bottom:2px;font-weight:600;}
@keyframes su{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@keyframes fd{from{opacity:0}to{opacity:1}}
.paso{display:flex;align-items:center;gap:8px;margin:20px 0 8px;font-size:12px;font-weight:600;color:var(--navy);text-transform:uppercase;letter-spacing:.05em;}
.paso i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.doc-cab{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;padding:12px 14px;border:1px solid var(--filo);border-radius:var(--r);background:var(--fondo);margin-top:10px;}
.doc-cab .t{font-size:12px;color:var(--gris);}
.doc-cab .v{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:20px;color:var(--navy);}
details summary{cursor:pointer;}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.chips button{display:flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 8px;border:1px solid #D0D5DD;border-radius:10px;background:var(--papel);font-family:inherit;font-size:14px;font-weight:600;color:var(--tinta);}
.chips button.sel{border-color:var(--navy);background:var(--navy);color:#fff;box-shadow:0 0 0 3px rgba(31,52,76,.15);}
#cajaFirma{position:relative;width:100%;height:160px;border:1.5px dashed #98A2B3;border-radius:var(--r);background:#FCFCFD;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--gris);font-weight:600;font-size:14.5px;overflow:hidden;cursor:pointer;}
#cajaFirma::after{content:'';position:absolute;left:10%;right:10%;bottom:34px;border-bottom:1px solid #D0D5DD;}
#cajaFirma img{max-width:100%;max-height:100%;position:relative;z-index:1;}
.pad{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;}
.pad .cab{padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:var(--navy);color:rgba(255,255,255,.8);font-size:13px;}
.pad .cab b{color:#fff;font-size:16px;}
.pad .area{flex:1 1 0;min-height:0;position:relative;background:#fff;}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:transparent;z-index:1;}
.pad .linea-firma{position:absolute;left:8%;right:8%;bottom:22%;border-bottom:1.5px solid #98A2B3;pointer-events:none;}
.pad .linea-firma::before{content:'Firma del cliente';position:absolute;left:0;top:8px;font-size:11px;color:#98A2B3;letter-spacing:.06em;text-transform:uppercase;}
.pad .linea-firma::after{content:'×';position:absolute;left:-18px;bottom:0;font-size:22px;color:#98A2B3;}
.pad .pie{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--filo);background:var(--fondo);}
.pad .pie .btn{flex:1;min-height:50px;font-size:15px;}
.pad .pie .verde{flex:2;}
.interr{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--filo);border-radius:10px;margin-top:8px;}
.interr input{width:22px;height:22px;flex:none;}
.firma-img{max-width:100%;max-height:130px;border:1px solid var(--filo);border-radius:10px;background:#fff;padding:6px;margin-top:6px;}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--tinta);color:#fff;padding:12px 18px;border-radius:12px;font-size:13.5px;z-index:50;max-width:90vw;box-shadow:0 8px 24px rgba(16,24,40,.25);animation:su .2s ease;}
.vacio{text-align:center;color:var(--gris);padding:40px 16px;background:var(--papel);border-radius:var(--r);box-shadow:var(--sombra);}
.mono{font-family:'IBM Plex Mono',monospace;}
.instalar{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid var(--filo);border-radius:var(--r);background:var(--papel);box-shadow:var(--sombra);font-size:13px;align-items:center;gap:10px;}
.instalar img{width:40px;height:40px;border-radius:9px;flex:none;}
.instalar .t{flex:1;}
.instalar button{flex:none;}
#bfLogin{background:linear-gradient(180deg,var(--navy) 0 42%,var(--fondo) 42%) !important;font-family:'IBM Plex Sans',system-ui,sans-serif !important;}
#bfLoginForm{border:0 !important;border-radius:16px !important;padding:28px 24px !important;box-shadow:0 12px 40px rgba(16,24,40,.18);width:min(360px,92vw) !important;}
#bfLoginForm input{border-radius:10px !important;border:1px solid #D0D5DD !important;padding:12px !important;margin-bottom:10px !important;}
#bfLoginForm button[type=submit]{background:var(--navy) !important;border-radius:10px !important;padding:13px !important;font-weight:600;font-family:inherit;}
</style>
</head>

<script>
var CFG = {
  apiKey: "AIzaSyD0UwaxdqoAgei-pqr1abceXVj5jTzYw2o",

var db = firebase.database();

// Repartidores por defecto (= «Comercial» de AmbarX). Se pueden cambiar en ⋯ › Repartidores.
var REP_DEF = {
  '0': { nombre: 'Recogen en la nave', nave: true },
  '1': { nombre: 'Francisco José' },
  '2': { nombre: 'Juan' },

// ---------- estado ----------
var S = { dirs: {}, fecha: hoyISO(), docs: {}, ent: {}, asig: {}, orden: {}, salida: {}, coords: {}, eta: {}, leido: '', pet: null, rep: {}, yo: null, miCom: null, vista: 'lista', filtroCom: null };
var refs = [];

var DOM_REP='@reparto.rosasdebuscaflor.com';
function soloMovil(t){ var n=String(t||'').replace(/[\s.\-()]/g,'').replace(/^(\+34|0034)/,''); return /^[67]\d{8}$/.test(n) ? n : null; }
// Mientras dura la prueba los repartidores pueden entrar solo con el móvil (sin PIN)
function claveSinPin(m){ return 'bf-rep-'+m+'-sinpin'; }
function emailDeLogin(t){ var m=soloMovil(t); return m ? m+DOM_REP : String(t||'').trim(); }
// Modo prueba: sin usuario ni contraseña. Cada móvil elige quién es (se recuerda en el móvil).
function quien(){ try{ return localStorage.getItem('bf_rep_quien'); }catch(e){ return null; } }
function nombreYo(){ var q=quien(); return q==='oficina'||!q ? 'Oficina' : nombreRep(q); }
function hoyISO(d){ d = d || new Date(); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function p2(n){ return String(n).padStart(2,'0'); }
function ahora(){ var d=new Date(); return hoyISO(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }
function eur(n){ return (Math.round((+n||0)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function num(n){ return (+n||0).toLocaleString('es-ES',{maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
var ICO={pin:'<path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',tel:'<path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/>',firma:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',ok:'<path d="M20 6 9 17l-5-5"/>',doc:'<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',lect:'<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',arr:'<path d="m18 15-6-6-6 6"/>',aba:'<path d="m6 9 6 6 6-6"/>',efe:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>',tar:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',ban:'<path d="M3 21h18M5 21V10M19 21V10M9 21v-7M15 21v-7M2 10l10-6 10 6"/>',no:'<circle cx="12" cy="12" r="9"/><path d="m15 9-6 6"/>'};
function ico(n){ return '<svg class="i" viewBox="0 0 24 24">'+(ICO[n]||'')+'</svg>'; }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){e.remove();},2600); }
function fechaLarga(f){ var d=new Date(f+'T12:00:00'); var s=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}); return (f===hoyISO()?'Hoy · ':'')+s.charAt(0).toUpperCase()+s.slice(1); }
function moverDia(n){ var d=new Date(S.fecha+'T12:00:00'); d.setDate(d.getDate()+n); S.fecha=hoyISO(d); escuchar(); }

function reps(){ var r={}; Object.keys(REP_DEF).forEach(function(k){ r[k]=Object.assign({},REP_DEF[k]); }); Object.keys(S.rep||{}).forEach(function(k){ r[k]=Object.assign(r[k]||{}, S.rep[k]); }); return r; }
function nombreRep(c){ if(c===''||c==null) return '⚠ Sin repartidor: asígnalos'; var r=reps()[c]; return r ? r.nombre : ('Comercial ' + c); }
// Dirección de entrega: primero el listado de reparto (configPedidos/direccionesReparto), si no la fiscal de AmbarX
function entrega(d){
  var c=String(d.cliCod||''), nom=String(d.cliente||'').toUpperCase(), hit=null;
  Object.keys(S.dirs||{}).forEach(function(k){ var x=S.dirs[k]; if(hit||!x) return;
    if(c && (x.codigos||[]).map(String).indexOf(c)>=0) hit=x;
    else if((x.alias||[]).some(function(a){ return a && nom.indexOf(String(a).toUpperCase())>=0; })) hit=x; });
  if(hit) return { direccion: hit.direccion||'', poblacion: hit.poblacion||'', tel: hit.tel || d.tel || '', nombre: hit.nombre||'', reparto: true };
  return { direccion: d.direccion||'', poblacion: (d.poblacion||'').split(',')[0], tel: d.tel||'', nombre:'', reparto: false };
}
function comDe(d){ return S.asig[d.k] != null ? String(S.asig[d.k]) : String(d.comercial||''); }
function esOficina(){ return S.miCom == null && !S.bloqueado; }

// Documentos que cuentan para el reparto: albaranes y facturas directas (las facturas de albaranes no se entregan)
function lista(){
  return Object.keys(S.docs).map(function(k){ var d=S.docs[k]; d.k=k; d.cliente=String(d.cliente||'').trim(); return d; })
    .filter(function(d){ return !(d.tipo==='factura' && d.origen && !/directa/i.test(d.origen)); });
}
function ordenar(arr, com){
  var o = (S.orden && S.orden[com]) || [];
  if(!o.length && arr.length>1) o = rutaAuto(arr);
  arr.sort(function(a,b){ var ia=o.indexOf(a.k), ib=o.indexOf(b.k); if(ia<0) ia=999; if(ib<0) ib=999; return ia-ib; });
  calcEta(arr, com);
  return arr.sort(function(a,b){
    var ea=!!S.ent[a.k], eb=!!S.ent[b.k]; if(ea!==eb) return ea?1:-1;
    var ia=o.indexOf(a.k), ib=o.indexOf(b.k); if(ia<0) ia=999; if(ib<0) ib=999; if(ia!==ib) return ia-ib;
    var ea2=entrega(a), eb2=entrega(b), pa=(ea2.poblacion||'')+(ea2.direccion||''), pb=(eb2.poblacion||'')+(eb2.direccion||''); return pa.localeCompare(pb) || (a.cliente||'').localeCompare(b.cliente||'');
  });
}

// ---------- ruta automática y horas de llegada ----------
var ALM={lat:37.3755131, lng:-5.8983456};
function claveCoord(d){ return String(d.cliCod||'') || String(dirMaps(d).t||d.cliente||'').replace(/[.#$\/\[\]]/g,'-').slice(0,80); }
function coordDe(d){ var c=S.coords[claveCoord(d)]; return c && c.lat!=null ? c : null; }
function km(a,b){ var R=6371, r=Math.PI/180, dl=(b.lat-a.lat)*r, dn=(b.lng-a.lng)*r;
  var x=Math.sin(dl/2)*Math.sin(dl/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)*Math.sin(dn/2); return 2*R*Math.asin(Math.sqrt(x)); }
// Minutos de coche aproximados: distancia en línea recta × 1,3; 25 km/h en ciudad (tramos cortos), 65 km/h en carretera
function minutos(a,b){ var d=km(a,b)*1.3; return d<0.05?0 : d<10 ? d/25*60 : 10/25*60 + (d-10)/65*60; }
function rutaAuto(arr){
  var con=arr.filter(coordDe), sin=arr.filter(function(d){ return !coordDe(d); });
  // vecino más cercano desde el almacén y luego mejora 2-opt
  var ruta=[], quedan=con.slice(), pos=ALM;
  while(quedan.length){ var mi=0, md=1e9; quedan.forEach(function(d,i){ var x=km(pos,coordDe(d)); if(x<md){md=x;mi=i;} }); pos=coordDe(quedan[mi]); ruta.push(quedan.splice(mi,1)[0]); }
  var P=function(i){ return i<0?ALM:coordDe(ruta[i]); }, mejora=true, vueltas=0;
  while(mejora && vueltas++<50){ mejora=false;
    for(var i=0;i<ruta.length-1;i++) for(var j=i+1;j<ruta.length;j++){
      var antes=km(P(i-1),P(i))+(j+1<ruta.length?km(P(j),P(j+1)):0), despues=km(P(i-1),P(j))+(j+1<ruta.length?km(P(i),P(j+1)):0);
      if(despues+1e-9<antes){ var seg=ruta.slice(i,j+1).reverse(); Array.prototype.splice.apply(ruta,[i,seg.length].concat(seg)); mejora=true; } } }
  return ruta.concat(sin).map(function(d){ return d.k; });
}
function calcEta(arr, com){
  var sal=(S.salida||{})[com]; arr.forEach(function(d){ delete S.eta[d.k]; }); if(!sal || !/^\d{1,2}:\d{2}$/.test(sal)) return;
  var t=+sal.split(':')[0]*60 + +sal.split(':')[1], pos=ALM, ult=null;
  arr.forEach(function(d){ var c=coordDe(d); if(!c) return;
    if(ult && km(ult,c)<0.05){ S.eta[d.k]=S.eta[ult.k]; return; }      // mismo sitio que la parada anterior
    if(ult) t+=10;                                                       // 10 min por entrega
    t+=minutos(pos,c); pos=c; ult={lat:c.lat,lng:c.lng,k:d.k};
    var h=Math.round(t/5)*5; S.eta[d.k]=('0'+Math.floor(h/60)%24).slice(-2)+':'+('0'+h%60).slice(-2); });
}
function horaLlegada(d){ return S.eta[d.k] || ''; }
// Geocodificar (OpenStreetMap) los clientes que aún no tienen coordenadas; se guardan en Firebase para todos
var GEO={cola:[], en:{}, activo:false};
function asegurarCoords(){
  lista().forEach(function(d){ var k=claveCoord(d); if(!k || S.coords[k] || GEO.en[k]) return; GEO.en[k]=1; GEO.cola.push(d); });
  if(!GEO.activo) sigGeo();
}
function sigGeo(){
  var d=GEO.cola.shift(); if(!d){ GEO.activo=false; return; } GEO.activo=true;
  var dm=dirMaps(d), p=String(d.poblacion||'').split(',')[0].split('-')[0].trim();
  var qs=[dm.t, dm.q, [String(d.cliente||'').replace(/,.*$/,''), p].filter(Boolean).join(', '), p].filter(function(x,i,a){ return x && a.indexOf(x)===i; });
  var intenta=function(i){
    if(i>=qs.length){ db.ref('buscaflor/configPedidos/coords/'+claveCoord(d)).set({ lat:null, q:qs[0]||'', fallo:ahora() }); setTimeout(sigGeo,1100); return; }
    fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=es&q='+encodeURIComponent(qs[i]))
      .then(function(r){ return r.json(); }).then(function(r){
        if(r && r[0]){ db.ref('buscaflor/configPedidos/coords/'+claveCoord(d)).set({ lat:+r[0].lat, lng:+r[0].lon, q:qs[i], aprox: i>=2 }); setTimeout(sigGeo,1100); }
        else setTimeout(function(){ intenta(i+1); },1100);
      }, function(){ setTimeout(function(){ intenta(i+1); },1100); });
  };
  intenta(0);
}

// ---------- datos ----------
function escuchar(){
  refs.forEach(function(r){ r.off(); }); refs=[];
  document.getElementById('fDia').textContent = fechaLarga(S.fecha);
  var base='buscaflor/reparto/'+S.fecha+'/';
  [['docs','docs'],['entregas','ent'],['asignar','asig'],['orden','orden'],['salida','salida'],['leido','leido']].forEach(function(x){
    var r=db.ref(base+x[0]); refs.push(r);
    r.on('value',function(s){ S[x[1]] = s.val() || (x[1]==='leido'?'':{}); if(x[0]==='docs') asegurarCoords(); pintar(); }, function(e){ pintarError(e); });
  });
  var rp=db.ref('buscaflor/peticiones/reparto'); refs.push(rp); rp.on('value',function(s){ S.pet=s.val(); pintar(); });
  var ra=db.ref('buscaflor/peticiones/agenteStock'); refs.push(ra); ra.on('value',function(s){ S.ag=s.val()||{}; pintar(); });
}
function pintarError(e){ document.getElementById('app').innerHTML='<div class="alerta mal">No se pueden leer los datos: '+esc(e&&e.message||e)+'</div>'; }

// ---------- pantalla ----------
function pintar(){
  if (S.vista !== 'lista') return;
  var app=document.getElementById('app');
  var docs=lista();
  if (S.bloqueado) { app.innerHTML='<div class="vacio">Este móvil no tiene acceso al reparto.<br>Pide en la oficina que te den acceso.<br><br><button class="btn" onclick="firebase.auth().signOut()">Salir</button></div>'; return; }
  if (!esOficina()) return pintarRepartidor(app, docs);
  pintarOficina(app, docs);
}

function totalesDe(docs){
  var t={n:docs.length, hechas:0, efectivo:0, tarjeta:0, transferencia:0, pendiente:0, inc:0};
  docs.forEach(function(d){ var e=S.ent[d.k]; if(!e) return; if(e.estado==='incidencia'){t.inc++;return;} t.hechas++; var c=e.cobro||{}; var f=c.forma||'pendiente'; if(f==='efectivo'||f==='tarjeta'||f==='transferencia') t[f]+= +c.importe||0; else t.pendiente += +d.total||0; });
  return t;
}

function tarjeta(d){
  var e=S.ent[d.k];
  var cls='card'+(e?(e.estado==='incidencia'?' inc':' hecha'):'');
  var en=entrega(d);
  var dir=[en.nombre, en.direccion, en.poblacion].filter(Boolean).join(' · ');
  var q=encodeURIComponent([en.direccion,en.poblacion].filter(Boolean).join(', '));
  var tel=(String(en.tel||'').replace(/\s/g,'').match(/(?:\+34)?[6789]\d{8}/)||[''])[0];
  var estado = !e ? '' : e.estado==='incidencia' ? '<span class="tag mal">No entregado · '+esc(e.motivo||'')+'</span>'
    : '<span class="tag ok">Entregado '+esc((e.hora||'').slice(11,16))+'</span><span class="tag">'+esc(textoCobro(e.cobro))+'</span>'+estadoAmbarx(e);
  return '<div class="'+cls+'"><div class="top" onclick="abrir(\''+d.k+'\')"><div><div class="cli">'+esc(d.cliente)+'</div>'+
    '<div class="dir">'+esc(dir||'(sin dirección en AmbarX)')+'</div>'+
    '<div style="margin-top:5px">'+(!e&&horaLlegada(d)?'<span class="tag" style="font-weight:600">~'+horaLlegada(d)+'</span>':'')+'<span class="tag'+(d.tipo==='factura'?' fac':'')+'">'+(d.tipo==='factura'?'Factura ':'Albarán ')+esc(d.num)+'</span>'+estado+'</div></div>'+
    '<div class="imp">'+eur(d.total)+'</div></div>'+
    (!esOficina() && !e ? '<div class="acc">'+(q?'<a class="btn peq" href="https://www.google.com/maps/dir/?api=1&destination='+q+'" target="_blank">'+ico('pin')+' Cómo llegar</a>':'')+
      (tel?'<a class="btn peq" href="tel:'+esc(tel)+'">'+ico('tel')+' Llamar</a>':'')+
      '<button class="btn peq" onclick="mover(\''+d.k+'\',-1)" aria-label="Subir">'+ico('arr')+'</button><button class="btn peq" onclick="mover(\''+d.k+'\',1)" aria-label="Bajar">'+ico('aba')+'</button>'+
      '<button class="btn peq primario" onclick="entregar(\''+d.k+'\')">'+ico('firma')+' Entregar y firmar</button></div>' : '')+
    '</div>';
}
function estadoAmbarx(e){
  if(!e || e.estado!=='entregado') return '';
  var a=e.ambarx||{}, t='';
  if(e.firma) t += a.firma==='adjunto'||a.firma==='firmado'||a.firma==='yaFirmado' ? '<span class="tag ok">Firmado y guardado en AmbarX</span>' : a.firma==='error' ? '<span class="tag mal">Firma: error en AmbarX</span>' : '<span class="tag">Firma → AmbarX…</span>';
  var fc=(e.cobro||{}).forma;
  if((fc==='efectivo'||fc==='tarjeta') && (+(e.cobro||{}).importe||0)>0) t += a.cobro==='cobrado'||a.cobro==='yaCobrado' ? '<span class="tag ok">Cobrado en AmbarX</span>' : a.cobro==='error' ? '<span class="tag mal">Cobro: error en AmbarX</span>' : '<span class="tag">Cobro → AmbarX…</span>';
  if(e.emailDirecto&&e.emailDirecto.estado==='enviado') t += '<span class="tag ok">Email enviado desde el buzón</span>';
  if(a.firma==='adjunto' && a.email!=='directo') t += a.email==='enviado' ? '<span class="tag ok">Email enviado</span>' : a.email==='sinEmail' ? '<span class="tag mal">Cliente sin email</span>' : a.email==='error' ? '<span class="tag mal">Email: error</span>' : '<span class="tag">Email → cliente…</span>';
  return t;
}
function textoCobro(c){ c=c||{}; var f=c.forma||'pendiente'; return f==='efectivo'?'Efectivo '+eur(c.importe):f==='tarjeta'?'Tarjeta '+eur(c.importe):f==='transferencia'?'Transferencia '+eur(c.importe):'Sin cobrar'; }

function pintarRepartidor(app, docs){
  var mios=ordenar(docs.filter(function(d){ return comDe(d)===String(S.miCom); }), String(S.miCom));
  var t=totalesDe(mios);
  var h='<div class="resumen"><div><b>'+t.hechas+'/'+t.n+'</b><span>entregas</span></div><div><b>'+num(t.efectivo)+'</b><span>€ efectivo</span></div><div><b>'+num(t.tarjeta)+'</b><span>€ tarjeta</span></div></div>';
  if (!mios.length) h+='<div class="vacio">No tienes entregas para este día.<br><br>'+(S.leido?'Última lectura de AmbarX: '+esc(S.leido.slice(11,16)):'Todavía no se han leído los albaranes de AmbarX.')+'</div>';
  // Las entregas ya firmadas se quitan de la lista para que el repartidor no se lie; se pueden ver con el botón de abajo
  var pend=mios.filter(function(d){ var e=S.ent[d.k]; return !(e && e.estado==='entregado'); });
  var hechas=mios.filter(function(d){ var e=S.ent[d.k]; return e && e.estado==='entregado'; });
  if (mios.length && !pend.length) h+='<div class="vacio">✔ Has terminado todas las entregas del día.</div>';
  h+=pend.map(tarjeta).join('');
  if (hechas.length) {
    h+='<div class="fila-btn"><button class="btn" onclick="S.verHechas=!S.verHechas;pintar()">'+(S.verHechas?'Ocultar':'Ver')+' entregadas ('+hechas.length+')</button></div>';
    if (S.verHechas) h+=hechas.map(tarjeta).join('');
  }
  app.innerHTML=h;
}

function pintarOficina(app, docs){
  var r=reps(), grupos={};
  docs.forEach(function(d){ var c=comDe(d); (grupos[c]=grupos[c]||[]).push(d); });
  var pet=S.pet||{};
  var estadoPet = pet.estado==='pedido'&&pet.fecha===S.fecha ? 'Pedido a AmbarX, esperando al servidor…' : pet.estado==='enCurso' ? 'El servidor está leyendo AmbarX…' : pet.estado==='error' ? 'Error: '+esc(pet.error) : '';
  var ag=S.ag||{}, minAg=ag.visto?(Date.now()-new Date(ag.visto).getTime())/60000:1e9;
  var aviso = minAg>3 ? 'El ordenador de AmbarX no responde'+(ag.visto?' desde las '+esc(String(ag.visto).slice(11,16)):'')+': las firmas y cobros no pasan a AmbarX. Tiene que estar encendido con Chrome y AmbarX abierto.'
            : (ag.ambarx==='login'||ag.ambarx==='caducada') ? 'AmbarX pide la contraseña en el ordenador de la oficina: hasta que alguien entre, las firmas y cobros no pasan a AmbarX.' : '';
  var h=(aviso?'<div class="alerta mal">'+aviso+'</div>':'')+'<div class="fila-btn"><button class="btn primario" onclick="pedirLectura()">'+ico('lect')+' Leer albaranes y facturas de AmbarX</button></div>'+
    '<div class="nota">'+(S.leido?'Leído de AmbarX a las '+esc(S.leido.slice(11,16)):'Sin leer todavía para este día')+(estadoPet?' · <b>'+estadoPet+'</b>':'')+'</div>';
  var t=totalesDe(docs);
  h+='<div class="resumen"><div><b>'+t.hechas+'/'+t.n+'</b><span>entregados</span></div><div><b>'+num(t.efectivo)+'</b><span>€ efectivo</span></div><div><b>'+num(t.tarjeta)+'</b><span>€ tarjeta</span></div></div>';
  if (!docs.length) h+='<div class="vacio">No hay albaranes ni facturas para este día.</div>';
  if (grupos['']) h+='<div class="alerta mal">Hay '+grupos[''].length+' documento(s) sin repartidor en AmbarX: ningún repartidor los ve. Ábrelos y pulsa «Cambiar repartidor» (o «Recogen en la nave»).</div>';
  Object.keys(grupos).sort(function(a,b){ return a===''?-1:b===''?1:(+a)-(+b); }).forEach(function(c){
    var g=ordenar(grupos[c], c), tg=totalesDe(g), ab=S.filtroCom===c;
    h+='<h2><span onclick="S.filtroCom=S.filtroCom===\''+c+'\'?null:\''+c+'\';pintar()">'+(ab?'▾ ':'▸ ')+esc(nombreRep(c))+' · '+tg.hechas+'/'+tg.n+'</span>'+
      '<span><button class="btn peq" onclick="hojaRuta(\''+c+'\')">Hoja de ruta</button></span></h2>';
    h+='<div class="nota">Total '+eur(g.reduce(function(s,d){return s+(+d.total||0);},0))+' · efectivo '+eur(tg.efectivo)+' · tarjeta '+eur(tg.tarjeta)+(tg.transferencia?' · transf. '+eur(tg.transferencia):'')+(tg.inc?' · <b style="color:var(--rojo)">'+tg.inc+' sin entregar</b>':'')+'</div>';
    if (ab) h+=g.map(tarjeta).join('');
  });
  app.innerHTML=h;
}

// ---------- acciones ----------
function pedirLectura(){
  db.ref('buscaflor/peticiones/reparto').set({ pedido: ahora(), fecha: S.fecha, por: nombreYo(), estado: 'pedido' })
    .then(function(){ toast('Pedido. El servidor lo lee en menos de un minuto.'); }, function(e){ toast('Error: '+e.message); });
}
function mover(k, dir){
  var com=String(S.miCom), mios=ordenar(lista().filter(function(d){ return comDe(d)===com && !S.ent[d.k]; }), com).map(function(d){return d.k;});
  var i=mios.indexOf(k), j=i+dir; if(i<0||j<0||j>=mios.length) return;
  mios[i]=mios[j]; mios[j]=k;
  db.ref('buscaflor/reparto/'+S.fecha+'/orden/'+com).set(mios);
}

function velo(html){ cerrarVelo(); var v=document.createElement('div'); v.className='velo'; v.id='velo'; v.innerHTML='<div class="hoja">'+html+'</div>'; v.onclick=function(e){ if(e.target===v) cerrarVelo(); }; document.body.appendChild(v); S.vista='hoja'; return v; }

function iniciarLienzo(){
  var c=document.getElementById('lienzo'); if(!c) return;

  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  var x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.lineWidth=2.6; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111'; x.fillStyle='#111';

  function pt(e){ var b=c.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
  c.onpointerdown=function(e){ e.preventDefault(); c.setPointerCapture(e.pointerId); var p=pt(e); P.actual=[p]; P.trazos.push(P.actual); x.beginPath(); x.arc(p.x,p.y,1.3,0,7); x.fill(); };

function aceptarPad(){
  if(!P || !P.trazos.length){ toast('El cliente todavía no ha firmado'); return; }
  // Recorta la firma a lo dibujado y la guarda en PNG de 700 px como máximo
  var xs=[],ys=[]; P.trazos.forEach(function(t){ t.forEach(function(p){ xs.push(p.x); ys.push(p.y); }); });
  var m=12, x0=Math.max(0,Math.min.apply(null,xs)-m), y0=Math.max(0,Math.min.apply(null,ys)-m), x1=Math.max.apply(null,xs)+m, y1=Math.max.apply(null,ys)+m;
  var w=x1-x0, h=y1-y0, k=Math.min(1, 700/w, 300/h)*1.0; if(w<40||h<15){ k=1; }
  var o=document.createElement('canvas'); o.width=Math.max(1,Math.round(w*k)); o.height=Math.max(1,Math.round(h*k));
  var g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,o.width,o.height); g.lineWidth=Math.max(1.6,2.6*k); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#111'; g.fillStyle='#111';
  P.trazos.forEach(function(t){ g.beginPath(); t.forEach(function(p,i){ var X=(p.x-x0)*k, Y=(p.y-y0)*k; i?g.lineTo(X,Y):g.moveTo(X,Y); }); if(t.length===1){ g.arc((t[0].x-x0)*k,(t[0].y-y0)*k,1.5,0,7); g.fill(); } else g.stroke(); });

// Hoja de ruta: paradas en orden, enlaces de Google Maps y mensaje listo para WhatsApp (formato de tarjetas con ▶️ por parada)

  var texto=[dir,[cp,pueblo].filter(Boolean).join(' ')].filter(Boolean).join(', ');
  // Direcciones por km de carretera: Google las sitúa mal, así que se busca el negocio por su nombre en el pueblo
  if(/\b(km|ctra|crta|carretera)\b/i.test(dir) && pueblo){
    var nom=String(d.cliente||'').replace(/,.*$/,'').replace(/\b(S\.?\s?L\.?\s?L?\.?\s?U?\.?|S\.?\s?A\.?|SL|SLL|SLU|SA)\s*$/i,'').trim();

  docs.forEach(function(d){ var dm=dirMaps(d), q=dm.q, key=(d.cliCod||d.cliente)+'|'+q;

    '<div class="fila-btn" style="align-items:flex-end"><div style="flex:1"><label>Hora de salida del almacén</label><input id="horaSalida" type="time" value="'+esc((S.salida||{})[c]||'')+'"></div>'+
    '<button class="btn primario" onclick="guardarSalida(\''+c+'\')">Calcular horas</button></div>'+
    (manual?'<div class="fila-btn"><button class="btn" onclick="ordenAuto(\''+c+'\')">Volver a ordenar sola desde el almacén</button></div>':'');
  if(!par.length) h+='<div class="vacio">No quedan entregas pendientes.</div>';
  else {
    h+='<div class="fila-btn">'+rutas.map(function(u,i){ return '<a class="btn primario" style="text-decoration:none;text-align:center" target="_blank" href="'+esc(u)+'">'+ico('pin')+' Ver ruta en Maps'+(rutas.length>1?' (tramo '+(i+1)+')':'')+'</a>'; }).join('')+'</div>';
    h+='<ol style="padding-left:20px;margin:10px 0">'+par.map(function(p){ return '<li style="margin-bottom:6px">'+(horaLlegada(p.docs[0])?'<b>~'+horaLlegada(p.docs[0])+'</b> · ':'')+'<b>'+esc(p.cliente)+'</b>'+(coordDe(p.docs[0])?'':' <span class="tag mal">sin ubicar</span>')+'<br><span class="nota">'+esc(p.t||'(sin dirección)')+(p.tel?' · '+esc(p.tel):'')+'</span> <a target="_blank" href="'+esc(urlNav(p.q))+'">Maps</a></li>'; }).join('')+'</ol>';
    h+='<label>Mensaje para WhatsApp</label><textarea id="msgRuta" readonly style="width:100%;min-height:220px;font-size:12px;box-sizing:border-box">'+esc(msg)+'</textarea>';
    h+='<div class="fila-btn"><button class="btn" onclick="copiarRuta()">Copiar mensaje</button><a class="btn verde" style="text-decoration:none;text-align:center" target="_blank" href="https://wa.me/?text='+encodeURIComponent(msg)+'">Enviar por WhatsApp</a></div>';
  }
  h+='<div class="fila-btn"><button class="btn" onclick="hojaRutaPdf(\''+c+'\')">Hoja en PDF</button><button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function guardarSalida(c){ var v=document.getElementById('horaSalida').value;
  db.ref('buscaflor/reparto/'+S.fecha+'/salida/'+c).set(v||null).then(function(){ toast(v?'Salida '+v+': horas calculadas':'Hora de salida quitada'); hojaRuta(c); }); }
function ordenAuto(c){ db.ref('buscaflor/reparto/'+S.fecha+'/orden/'+c).remove().then(function(){ toast('Ordenada desde el almacén'); hojaRuta(c); }); }
function copiarRuta(){ var t=document.getElementById('msgRuta'); if(!t) return;
  var ok=function(){ toast('Mensaje copiado'); };
  if(navigator.clipboard) navigator.clipboard.writeText(t.value).then(ok,function(){ t.select(); document.execCommand('copy'); ok(); });
  else { t.select(); document.execCommand('copy'); ok(); } }
function hojaRutaPdf(c){
  var docs=ordenar(lista().filter(function(d){ return comDe(d)===c; }), c), doc=nuevoPdf(); if(!doc) return;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Hoja de ruta · '+nombreRep(c),14,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(fechaLarga(S.fecha)+' · '+docs.length+' entregas · Rosas de Buscaflor',14,20);
  doc.autoTable({ startY:25, head:[['#','Cliente','Dirección','Teléfono','Documento','Total','Firma / cobro']],
    body:docs.map(function(d,i){ var en=entrega(d); return [i+1, d.cliente+(en.nombre?'\n'+en.nombre:''), [en.direccion,en.poblacion].filter(Boolean).join(', '), en.tel||'', d.num, eur(d.total), '']; }),
    theme:'grid', styles:{fontSize:8.5,textColor:0,lineColor:120,lineWidth:0.1,minCellHeight:12,valign:'middle'}, headStyles:{fillColor:false,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:7},5:{halign:'right'},6:{cellWidth:32}} });
  var y=doc.lastAutoTable.finalY+6; doc.setFont('helvetica','bold'); doc.text('Total: '+eur(docs.reduce(function(s,d){return s+(+d.total||0);},0)),196,y,{align:'right'});
  compartirPdf(doc,'ruta_'+S.fecha+'_'+nombreRep(c).replace(/\s+/g,'-')+'.pdf','Hoja de ruta');
}

// ---------- menú ----------
function menu(){
  var h='<h3>'+esc(nombreYo())+'</h3><div class="fila-btn" style="flex-direction:column">'+
    '<button class="btn primario" onclick="elegirQuien()">Cambiar de repartidor</button>'+
    (esOficina()?'<button class="btn" onclick="caja()">Caja del día por repartidor</button><a class="btn" style="text-align:center;text-decoration:none" href="pedidos.html">Ir a la app de pedidos</a>':'<button class="btn" onclick="pedirLectura();cerrarVelo()">'+ico('lect')+' Pedir lectura de AmbarX</button>')+
    (esApp()?'':'<button class="btn" onclick="try{localStorage.removeItem(\'bf_rep_noinst\')}catch(e){};cerrarVelo();pintarInstalar()">Instalar como app</button>')+
    '<button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function caja(){
  var docs=lista(), grupos={}; docs.forEach(function(d){ var c=comDe(d); (grupos[c]=grupos[c]||[]).push(d); });
  var filas=Object.keys(grupos).sort(function(a,b){return a-b;}).map(function(c){ var t=totalesDe(grupos[c]); return [nombreRep(c), t.hechas+'/'+t.n, t.efectivo, t.tarjeta, t.transferencia, t.pendiente]; });
  var tot=filas.reduce(function(s,f){ return [s[0],s[1],s[2]+f[2],s[3]+f[3],s[4]+f[4],s[5]+f[5]]; },['Total','',0,0,0,0]);
  var h='<h3>Caja · '+esc(fechaLarga(S.fecha))+'</h3><table><tr><th>Repartidor</th><th>Entr.</th><th>Efectivo</th><th>Tarjeta</th><th>Transf.</th><th>Sin cobrar</th></tr>'+
    filas.concat([tot]).map(function(f,i){ var b=i===filas.length; return '<tr>'+'<td class="txt">'+(b?'<b>':'')+esc(f[0])+(b?'</b>':'')+'</td><td>'+f[1]+'</td><td>'+num(f[2])+'</td><td>'+num(f[3])+'</td><td>'+num(f[4])+'</td><td>'+num(f[5])+'</td></tr>'; }).join('')+'</table>'+
    '<div class="nota">«Sin cobrar» suma lo entregado sin cobro. Lo no entregado no cuenta.</div><div class="fila-btn"><button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function verRepartidores(){
  var r=reps();
  var h='<h3>Repartidores</h3><div class="nota">El número es el «Comercial» de AmbarX. Cada repartidor entra con su móvil y un PIN de 6 cifras, y solo ve sus entregas. Los transportistas externos pueden tener acceso o usar la hoja de ruta en papel.</div>'+
    Object.keys(r).sort(function(a,b){return a-b;}).map(function(c){ var x=r[c]; return '<div class="card" style="border-left-color:var(--navy)"><b class="mono">'+esc(c)+'</b> · '+esc(x.nombre)+(x.externo?' <span class="tag">externo</span>':'')+(x.nave?' <span class="tag">nave</span>':'')+
      '<div class="nota">'+(x.email?'Entra con '+esc(x.movil||x.email)+(x.sinPin?' (sin PIN)':' + PIN'):'Sin acceso')+'</div>'+'<button class="btn peq" onclick="editarRep(\''+c+'\')">'+(x.email?'Cambiar acceso':'Dar acceso')+'</button>'+'</div>'; }).join('')+
    '<div class="fila-btn"><button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function editarRep(c){
  var x=reps()[c];
  velo('<h3>Acceso de '+esc(x.nombre)+'</h3>'+(x.email?'<div class="nota">Ahora entra con '+esc(x.movil||x.email)+'</div>':'')+
    '<label>Móvil del repartidor</label><input id="rMov" type="tel" inputmode="numeric" placeholder="600123456" value="'+esc(x.movil||'')+'">'+
    '<label>PIN de 6 cifras (opcional)</label><input id="rPin" type="tel" inputmode="numeric" maxlength="6" placeholder="Déjalo vacío para entrar solo con el móvil" autocomplete="off">'+
    '<div class="nota">Sin PIN, el repartidor entra solo con su número de móvil (para la prueba). Con PIN, tendrá que escribirlo la primera vez.</div>'+
    '<div class="fila-btn"><button class="btn primario" onclick="guardarRep(\''+c+'\')">Dar acceso</button><button class="btn" onclick="verRepartidores()">Volver</button></div>'+
    (x.email?'<div class="fila-btn"><button class="btn peligro" onclick="quitarRep(\''+c+'\')">Quitar acceso</button></div>':''));
}
function guardarRep(c){
  var mov=soloMovil(document.getElementById('rMov').value), pin=document.getElementById('rPin').value.trim();
  if(!mov){ toast('Pon un móvil español de 9 cifras'); return; }
  if(pin && !/^\d{6}$/.test(pin)){ toast('El PIN tiene que ser de 6 cifras (o déjalo vacío)'); return; }
  if(pin && /^(\d)\1{5}$|^123456$|^654321$/.test(pin)){ toast('Ese PIN es demasiado fácil'); return; }
  var clave = pin || claveSinPin(mov), yaTenia=false;
  var em=mov+DOM_REP;
  // Crea la cuenta con una segunda conexión para no cerrar la sesión de la oficina
  var app2 = firebase.apps.find(function(a){ return a.name==='alta'; }) || firebase.initializeApp(CFG,'alta');
  app2.auth().createUserWithEmailAndPassword(em, clave).then(function(){ return app2.auth().signOut(); })
    .catch(function(e){ if(e.code==='auth/email-already-in-use'){ yaTenia=true; return; } throw e; })
    .then(function(){ return db.ref('buscaflor/configPedidos/repartidores/'+c).update({ email: em, movil: mov, sinPin: !pin, nombre: reps()[c].nombre }); })
    .then(function(){ toast(yaTenia?'Ese móvil ya tenía cuenta: entra como la primera vez (con su PIN si se lo pusiste)':'Acceso creado: '+mov); verRepartidores(); }, function(e){ toast(e.message||String(e)); });
}
function quitarRep(c){
  if(!confirm('¿Quitar el acceso a '+reps()[c].nombre+'? Dejará de ver sus entregas.')) return;
  db.ref('buscaflor/configPedidos/repartidores/'+c).update({ email: null, movil: null }).then(function(){ toast('Acceso quitado'); verRepartidores(); });
}

// ---------- app instalable ----------
var promptInstalar=null;
function esApp(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function pintarInstalar(){
  var b=document.getElementById('bInstalar'), l=document.getElementById('bInstalarLogin');
  var ocultar=esApp() || (function(){ try{ return localStorage.getItem('bf_rep_noinst')==='1'; }catch(e){ return false; } })();
  if (ocultar){ b.style.display='none'; if(l) l.innerHTML=''; return; }
  var txt, btn='';
  if (promptInstalar){ txt='<b>Instala la app de Reparto</b><br>Tendrás el icono en el móvil y se abre a pantalla completa.'; btn='<button class="btn primario peq" onclick="instalar()">Instalar</button>'; }
  else if (esIOS()){ txt='<b>Ponla como app:</b> pulsa <b>Compartir</b> <span style="font-size:15px">⎋</span> y luego <b>«Añadir a pantalla de inicio»</b>.'; }
  else { txt='<b>Ponla como app:</b> en el menú ⋮ del navegador, pulsa <b>«Instalar app»</b> o <b>«Añadir a pantalla de inicio»</b>.'; }
  b.innerHTML='<img src="icons/reparto-192.png" alt=""><div class="t">'+txt+'</div>'+btn+'<button class="btn peq" onclick="noInstalar()" aria-label="Cerrar">✕</button>';
  b.style.display='flex';
  if(l) l.innerHTML = promptInstalar ? '<a href="#" onclick="instalar();return false">📲 Instalar la app en este móvil</a>' : (esIOS()?'📲 Para tenerla como app: Compartir › «Añadir a pantalla de inicio»':'');
}
function instalar(){ if(!promptInstalar) return; promptInstalar.prompt(); promptInstalar.userChoice.then(function(){ promptInstalar=null; pintarInstalar(); }); }
function noInstalar(){ try{ localStorage.setItem('bf_rep_noinst','1'); }catch(e){} pintarInstalar(); }
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); promptInstalar=e; pintarInstalar(); });
window.addEventListener('appinstalled', function(){ promptInstalar=null; pintarInstalar(); toast('App instalada'); });
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw-reparto.js', { scope: './reparto' }).catch(function(){}); }); }
setTimeout(pintarInstalar, 300);

// ---------- arranque ----------
document.getElementById('fAnt').onclick=function(){ moverDia(-1); };
document.getElementById('fSig').onclick=function(){ moverDia(1); };
document.getElementById('fHoy').onclick=function(){ S.fecha=hoyISO(); escuchar(); };
document.getElementById('bMenu').onclick=menu;

// Pantalla «¿Quién eres?»
function elegirQuien(){
  var r=reps();
  var h='<h3>¿Quién eres?</h3><div class="nota">Elige tu nombre para ver tus entregas. El móvil lo recordará.</div><div class="fila-btn" style="flex-direction:column">'+
    Object.keys(r).sort(function(a,b){return a-b;}).map(function(c){
      return '<button class="btn'+(quien()===c?' primario':'')+'" style="padding:15px;font-size:16px" onclick="ponerQuien(\''+c+'\')">'+''+esc(r[c].nombre)+(r[c].nave?' (almacén)':'')+'</button>'; }).join('')+
    '<button class="btn'+(quien()==='oficina'?' primario':'')+'" style="padding:15px;font-size:16px" onclick="ponerQuien(\'oficina\')">Oficina (ver todos)</button></div>';
  velo(h);
  var v=document.getElementById('velo'); if(v) v.onclick=null; // no se cierra tocando fuera
}
function ponerQuien(c){
  try{ localStorage.setItem('bf_rep_quien', c); }catch(e){}
  aplicarQuien(); cerrarVelo();
}
function aplicarQuien(){
  var q=quien();
  S.miCom = (q && q!=='oficina') ? q : null; S.bloqueado=false;
  document.getElementById('titulo').textContent = esOficina() ? 'Reparto · Oficina' : 'Reparto · '+nombreRep(S.miCom);
}

document.getElementById('bfLogin').style.display='none';
db.ref('buscaflor/configPedidos/direccionesReparto').on('value', function(s){ S.dirs=s.val()||{}; pintar(); });
db.ref('buscaflor/configPedidos/coords').on('value', function(s){ S.coords=s.val()||{}; pintar(); });
var primeraVez=true;
db.ref('buscaflor/configPedidos/repartidores').on('value', function(s){
  S.rep=s.val()||{}; aplicarQuien(); pintar();
  if(primeraVez){ primeraVez=false; if(!quien()) elegirQuien(); }
});
escuchar();
</script>
