<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>
:root{--navy:#1F344C;--navy-suave:#EEF1F4;--papel:#fff;--fondo:#F7F8F9;--tinta:#1B2229;--gris:#6E7680;--filo:#E3E6E9;--verde:#2F7D5C;--rojo:#C0463A;--oro:#C79A3E;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{padding-bottom:calc(70px + env(safe-area-inset-bottom));font-family:'IBM Plex Sans',sans-serif;background:var(--fondo);color:var(--tinta);min-height:100vh;max-width:620px;margin:0 auto;font-size:14px;padding-bottom:70px;}
header{background:var(--papel);padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:3px solid var(--navy);position:sticky;top:0;z-index:5;}
header .fila{display:flex;align-items:center;justify-content:space-between;gap:8px;}
header h1{font-size:16px;color:var(--navy);font-weight:600;}
.fecha{display:flex;align-items:center;gap:6px;margin-top:8px;}
.fecha button{border:1px solid var(--filo);background:var(--papel);border-radius:6px;width:36px;height:34px;font-size:16px;color:var(--navy);}
.fecha .dia{flex:1;text-align:center;font-weight:600;color:var(--navy);}
main{padding:12px;}
.btn{padding:11px 12px;font-family:inherit;font-size:14px;font-weight:600;border:1px solid var(--navy);border-radius:8px;cursor:pointer;background:var(--papel);color:var(--navy);}
.btn.primario{background:var(--navy);color:#fff;}
.btn.verde{background:var(--verde);border-color:var(--verde);color:#fff;}
.btn.peligro{border-color:var(--rojo);color:var(--rojo);}
.btn.peq{padding:6px 10px;font-size:12px;border-radius:6px;}
.btn:disabled{opacity:.5;}
.fila-btn{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;}
.fila-btn .btn{flex:1 1 auto;}
input,select,textarea{font-family:inherit;font-size:15px;border:1px solid var(--filo);border-radius:8px;padding:10px;background:var(--papel);color:var(--tinta);width:100%;}
label{font-size:11.5px;font-weight:600;color:var(--gris);display:block;margin:12px 0 5px;text-transform:uppercase;letter-spacing:.03em;}
.nota{font-size:12px;color:var(--gris);margin:6px 0;}
.alerta{border:1px solid var(--oro);background:rgba(199,154,62,.08);border-radius:8px;padding:9px 11px;font-size:13px;margin:8px 0;}
.alerta.ok{border-color:var(--verde);background:rgba(47,125,92,.07);}
.alerta.mal{border-color:var(--rojo);background:rgba(192,70,58,.06);}
.resumen{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.resumen div{background:var(--papel);border:1px solid var(--filo);border-radius:8px;padding:8px;text-align:center;}
.resumen b{display:block;font-size:17px;color:var(--navy);font-family:'IBM Plex Mono',monospace;}
.resumen span{font-size:11px;color:var(--gris);}
.card{background:var(--papel);border:1px solid var(--filo);border-left:4px solid var(--oro);border-radius:8px;padding:11px 12px;margin-bottom:10px;}
.card.hecha{border-left-color:var(--verde);opacity:.8;}
.card.inc{border-left-color:var(--rojo);}
.card .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;}
.card .cli{font-weight:600;font-size:15px;color:var(--navy);}
.card .dir{font-size:12.5px;color:var(--gris);margin-top:2px;}
.card .imp{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:15px;white-space:nowrap;}
.card .acc{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap;}
.card .acc a,.card .acc button{flex:1 1 auto;text-align:center;text-decoration:none;}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:10px;background:var(--navy-suave);color:var(--navy);margin-right:4px;}
.tag.fac{background:#F3EAD6;color:#7A5A16;}
.tag.ok{background:rgba(47,125,92,.12);color:var(--verde);}
.tag.mal{background:rgba(192,70,58,.1);color:var(--rojo);}
h2{font-size:13px;color:var(--navy);text-transform:uppercase;letter-spacing:.04em;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:center;}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;}
th{text-align:right;font-size:10.5px;color:var(--gris);font-weight:600;padding:4px;text-transform:uppercase;}
td{padding:6px 4px;border-top:1px solid var(--filo);text-align:right;font-family:'IBM Plex Mono',monospace;}
th:first-child,td:first-child{text-align:left;} td.txt{font-family:'IBM Plex Sans',sans-serif;text-align:left;}
.velo{position:fixed;inset:0;background:rgba(20,30,40,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;}
.hoja{background:var(--papel);width:100%;max-width:620px;max-height:94vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 14px 24px;}
.hoja h3{font-size:16px;color:var(--navy);margin-bottom:2px;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chips button{flex:1 1 40%;padding:12px 8px;border:1px solid var(--filo);border-radius:8px;background:var(--papel);font-family:inherit;font-size:14px;font-weight:600;color:var(--tinta);}
.chips button.sel{border-color:var(--navy);background:var(--navy);color:#fff;}
#cajaFirma{width:100%;height:150px;border:2px dashed var(--gris);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;color:var(--gris);font-weight:600;font-size:15px;overflow:hidden;}
#cajaFirma img{max-width:100%;max-height:100%;}
.pad{position:fixed;inset:0;background:#fff;z-index:40;display:flex;flex-direction:column;}
.pad .cab{padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--filo);font-size:13px;color:var(--gris);}
.pad .cab b{color:var(--navy);font-size:15px;}
.pad .area{flex:1 1 0;min-height:0;position:relative;}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;background:#fff;}
.pad .linea-firma{position:absolute;left:8%;right:8%;bottom:22%;border-bottom:1px solid #bbb;pointer-events:none;}
.pad .pie{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--filo);}
.pad .pie .btn{flex:1;padding:14px 8px;font-size:15px;}
.interr{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--filo);border-radius:8px;margin-top:8px;}
.interr input{width:22px;height:22px;flex:none;}
.firma-img{max-width:100%;max-height:120px;border:1px solid var(--filo);border-radius:6px;background:#fff;}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;z-index:50;max-width:90vw;}
.vacio{text-align:center;color:var(--gris);padding:30px 10px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.instalar{display:none;margin:0 0 12px;padding:10px 12px;border:1px solid var(--navy);border-radius:10px;background:var(--navy-suave);font-size:13px;align-items:center;gap:10px;}
.instalar img{width:40px;height:40px;border-radius:9px;flex:none;}
.instalar .t{flex:1;}
.instalar button{flex:none;}
</style>
</head>
<body>
<header>
  <div class="fila"><h1 id="titulo">Reparto</h1><button class="btn peq" id="bMenu">⋯</button></div>
  <div class="fecha"><button id="fAnt">‹</button><div class="dia" id="fDia"></div><button id="fSig">›</button><button id="fHoy" style="width:auto;padding:0 10px;font-size:13px">Hoy</button></div>
</header>
<div id="bInstalar" class="instalar" style="margin:12px 12px 0"></div>
<main id="app"><div class="vacio">Cargando…</div></main>

<div id="bfLogin" style="display:none;position:fixed;inset:0;z-index:99999;background:#f4f4f4;align-items:center;justify-content:center;font-family:Arial,sans-serif">
  <form id="bfLoginForm" style="background:#fff;border:1px solid #ccc;border-radius:8px;padding:24px;width:min(320px,90vw)">
    <div style="font-size:18px;font-weight:bold;margin-bottom:4px">Buscaflor · Reparto</div>
    <div style="color:#666;font-size:13px;margin-bottom:16px">Inicia sesión para entrar</div>
    <input id="bfEmail" type="text" inputmode="email" autocomplete="username" placeholder="móvil (o email en la oficina)" required style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;font-size:15px">
    <input id="bfPass" type="password" autocomplete="current-password" placeholder="PIN (repartidores: déjalo vacío)" style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:8px;font-size:15px">
    <div id="bInstalarLogin" style="font-size:12px;color:#555;margin-bottom:10px"></div>
    <div id="bfLoginMsg" style="color:#c0392b;font-size:13px;min-height:18px;margin-bottom:8px"></div>
    <button type="submit" style="width:100%;padding:10px;font-size:15px;background:#222;color:#fff;border:0;border-radius:4px;cursor:pointer">Entrar</button>
  </form>
</div>

<script>
var CFG = {
  apiKey: "AIzaSyD0UwaxdqoAgei-pqr1abceXVj5jTzYw2o",
  authDomain: "stock-buscaflor.firebaseapp.com",
  databaseURL: "https://stock-buscaflor-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "stock-buscaflor",
  storageBucket: "stock-buscaflor.firebasestorage.app",
  messagingSenderId: "724662381940",
  appId: "1:724662381940:web:b72b12168bb6dada4f9021"
};
firebase.initializeApp(CFG);
var db = firebase.database();

// Repartidores por defecto (= «Comercial» de AmbarX). Se pueden cambiar en ⋯ › Repartidores.
var REP_DEF = {
  '0': { nombre: 'Recogen en la nave', nave: true },
  '1': { nombre: 'Francisco José' },
  '2': { nombre: 'Juan' },
  '3': { nombre: 'Javier' },
  '6': { nombre: 'Jorge' },
  '7': { nombre: 'Javier Gómez' },
  '8': { nombre: 'Ludiflora', externo: true },
  '9': { nombre: 'Cecotrans', externo: true },
  '13': { nombre: 'Cecotrans Sevilla', externo: true }
};

// ---------- estado ----------
var S = { dirs: {}, fecha: hoyISO(), docs: {}, ent: {}, asig: {}, orden: {}, leido: '', pet: null, rep: {}, yo: null, miCom: null, vista: 'lista', filtroCom: null };
var refs = [];

var DOM_REP='@reparto.rosasdebuscaflor.com';
function soloMovil(t){ var n=String(t||'').replace(/[\s.\-()]/g,'').replace(/^(\+34|0034)/,''); return /^[67]\d{8}$/.test(n) ? n : null; }
// Mientras dura la prueba los repartidores pueden entrar solo con el móvil (sin PIN)
function claveSinPin(m){ return 'bf-rep-'+m+'-sinpin'; }
function emailDeLogin(t){ var m=soloMovil(t); return m ? m+DOM_REP : String(t||'').trim(); }
// Modo prueba: sin usuario ni contraseña. Cada móvil elige quién es (se recuerda en el móvil).
function quien(){ try{ return localStorage.getItem('bf_rep_quien'); }catch(e){ return null; } }
function nombreYo(){ var q=quien(); return q==='oficina'||!q ? 'Oficina' : nombreRep(q); }
function hoyISO(d){ d = d || new Date(); return d.getFullYear() + '-' + p2(d.getMonth()+1) + '-' + p2(d.getDate()); }
function p2(n){ return String(n).padStart(2,'0'); }
function ahora(){ var d=new Date(); return hoyISO(d)+'T'+p2(d.getHours())+':'+p2(d.getMinutes())+':'+p2(d.getSeconds()); }
function eur(n){ return (Math.round((+n||0)*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + ' €'; }
function num(n){ return (+n||0).toLocaleString('es-ES',{maximumFractionDigits:2}); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(t){ var e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(function(){e.remove();},2600); }
function fechaLarga(f){ var d=new Date(f+'T12:00:00'); var s=d.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}); return (f===hoyISO()?'Hoy · ':'')+s.charAt(0).toUpperCase()+s.slice(1); }
function moverDia(n){ var d=new Date(S.fecha+'T12:00:00'); d.setDate(d.getDate()+n); S.fecha=hoyISO(d); escuchar(); }

function reps(){ var r={}; Object.keys(REP_DEF).forEach(function(k){ r[k]=Object.assign({},REP_DEF[k]); }); Object.keys(S.rep||{}).forEach(function(k){ r[k]=Object.assign(r[k]||{}, S.rep[k]); }); return r; }
function nombreRep(c){ var r=reps()[c]; return r ? r.nombre : ('Comercial ' + c); }
// Dirección de entrega: primero el listado de reparto (configPedidos/direccionesReparto), si no la fiscal de AmbarX
function entrega(d){
  var c=String(d.cliCod||''), nom=String(d.cliente||'').toUpperCase(), hit=null;
  Object.keys(S.dirs||{}).forEach(function(k){ var x=S.dirs[k]; if(hit||!x) return;
    if(c && (x.codigos||[]).map(String).indexOf(c)>=0) hit=x;
    else if((x.alias||[]).some(function(a){ return a && nom.indexOf(String(a).toUpperCase())>=0; })) hit=x; });
  if(hit) return { direccion: hit.direccion||'', poblacion: hit.poblacion||'', tel: hit.tel || d.tel || '', nombre: hit.nombre||'', reparto: true };
  return { direccion: d.direccion||'', poblacion: (d.poblacion||'').split(',')[0], tel: d.tel||'', nombre:'', reparto: false };
}
function comDe(d){ return S.asig[d.k] != null ? String(S.asig[d.k]) : String(d.comercial||''); }
function esOficina(){ return S.miCom == null && !S.bloqueado; }

// Documentos que cuentan para el reparto: albaranes y facturas directas (las facturas de albaranes no se entregan)
function lista(){
  return Object.keys(S.docs).map(function(k){ var d=S.docs[k]; d.k=k; d.cliente=String(d.cliente||'').trim(); return d; })
    .filter(function(d){ return !(d.tipo==='factura' && d.origen && !/directa/i.test(d.origen)); });
}
function ordenar(arr, com){
  var o = (S.orden && S.orden[com]) || [];
  return arr.sort(function(a,b){
    var ea=!!S.ent[a.k], eb=!!S.ent[b.k]; if(ea!==eb) return ea?1:-1;
    var ia=o.indexOf(a.k), ib=o.indexOf(b.k); if(ia<0) ia=999; if(ib<0) ib=999; if(ia!==ib) return ia-ib;
    var ea2=entrega(a), eb2=entrega(b), pa=(ea2.poblacion||'')+(ea2.direccion||''), pb=(eb2.poblacion||'')+(eb2.direccion||''); return pa.localeCompare(pb) || (a.cliente||'').localeCompare(b.cliente||'');
  });
}

// ---------- datos ----------
function escuchar(){
  refs.forEach(function(r){ r.off(); }); refs=[];
  document.getElementById('fDia').textContent = fechaLarga(S.fecha);
  var base='buscaflor/reparto/'+S.fecha+'/';
  [['docs','docs'],['entregas','ent'],['asignar','asig'],['orden','orden'],['leido','leido']].forEach(function(x){
    var r=db.ref(base+x[0]); refs.push(r);
    r.on('value',function(s){ S[x[1]] = s.val() || (x[1]==='leido'?'':{}); pintar(); }, function(e){ pintarError(e); });
  });
  var rp=db.ref('buscaflor/peticiones/reparto'); refs.push(rp); rp.on('value',function(s){ S.pet=s.val(); pintar(); });
}
function pintarError(e){ document.getElementById('app').innerHTML='<div class="alerta mal">No se pueden leer los datos: '+esc(e&&e.message||e)+'</div>'; }

// ---------- pantalla ----------
function pintar(){
  if (S.vista !== 'lista') return;
  var app=document.getElementById('app');
  var docs=lista();
  if (S.bloqueado) { app.innerHTML='<div class="vacio">Este móvil no tiene acceso al reparto.<br>Pide en la oficina que te den acceso.<br><br><button class="btn" onclick="firebase.auth().signOut()">Salir</button></div>'; return; }
  if (!esOficina()) return pintarRepartidor(app, docs);
  pintarOficina(app, docs);
}

function totalesDe(docs){
  var t={n:docs.length, hechas:0, efectivo:0, tarjeta:0, transferencia:0, pendiente:0, inc:0};
  docs.forEach(function(d){ var e=S.ent[d.k]; if(!e) return; if(e.estado==='incidencia'){t.inc++;return;} t.hechas++; var c=e.cobro||{}; var f=c.forma||'pendiente'; if(f==='efectivo'||f==='tarjeta'||f==='transferencia') t[f]+= +c.importe||0; else t.pendiente += +d.total||0; });
  return t;
}

function tarjeta(d){
  var e=S.ent[d.k];
  var cls='card'+(e?(e.estado==='incidencia'?' inc':' hecha'):'');
  var en=entrega(d);
  var dir=[en.nombre, en.direccion, en.poblacion].filter(Boolean).join(' · ');
  var q=encodeURIComponent([en.direccion,en.poblacion].filter(Boolean).join(', '));
  var tel=(String(en.tel||'').replace(/\s/g,'').match(/(?:\+34)?[6789]\d{8}/)||[''])[0];
  var estado = !e ? '' : e.estado==='incidencia' ? '<span class="tag mal">No entregado · '+esc(e.motivo||'')+'</span>'
    : '<span class="tag ok">Entregado '+esc((e.hora||'').slice(11,16))+'</span><span class="tag">'+esc(textoCobro(e.cobro))+'</span>'+estadoAmbarx(e);
  return '<div class="'+cls+'"><div class="top" onclick="abrir(\''+d.k+'\')"><div><div class="cli">'+esc(d.cliente)+'</div>'+
    '<div class="dir">'+esc(dir||'(sin dirección en AmbarX)')+'</div>'+
    '<div style="margin-top:5px"><span class="tag'+(d.tipo==='factura'?' fac':'')+'">'+(d.tipo==='factura'?'Factura ':'Albarán ')+esc(d.num)+'</span>'+estado+'</div></div>'+
    '<div class="imp">'+eur(d.total)+'</div></div>'+
    (!esOficina() && !e ? '<div class="acc">'+(q?'<a class="btn peq" href="https://www.google.com/maps/dir/?api=1&destination='+q+'" target="_blank">📍 Ir</a>':'')+
      (tel?'<a class="btn peq" href="tel:'+esc(tel)+'">📞 Llamar</a>':'')+
      '<button class="btn peq" onclick="mover(\''+d.k+'\',-1)">↑</button><button class="btn peq" onclick="mover(\''+d.k+'\',1)">↓</button>'+
      '<button class="btn peq primario" onclick="entregar(\''+d.k+'\')">✍️ Entregar</button></div>' : '')+
    '</div>';
}
function estadoAmbarx(e){
  if(!e || e.estado!=='entregado') return '';
  var a=e.ambarx||{}, t='';
  if(e.firma) t += a.firma==='firmado'||a.firma==='yaFirmado' ? '<span class="tag ok">Firmado en AmbarX</span>'+(a.pdf==='ok'?'<span class="tag ok">PDF listo</span>':'') : a.firma==='error' ? '<span class="tag mal">Firma: error en AmbarX</span>' : '<span class="tag">Firma → AmbarX…</span>';
  var fc=(e.cobro||{}).forma;
  if((fc==='efectivo'||fc==='tarjeta') && (+(e.cobro||{}).importe||0)>0) t += a.cobro==='cobrado'||a.cobro==='yaCobrado' ? '<span class="tag ok">Cobrado en AmbarX</span>' : a.cobro==='error' ? '<span class="tag mal">Cobro: error en AmbarX</span>' : '<span class="tag">Cobro → AmbarX…</span>';
  if(e.enviarEmail) t += a.email==='enviado' ? '<span class="tag ok">Email enviado</span>' : a.email==='sinEmail' ? '<span class="tag mal">Sin email en AmbarX</span>' : a.email==='error' ? '<span class="tag mal">Email: error</span>' : '<span class="tag">Email pendiente</span>';
  return t;
}
function textoCobro(c){ c=c||{}; var f=c.forma||'pendiente'; return f==='efectivo'?'Efectivo '+eur(c.importe):f==='tarjeta'?'Tarjeta '+eur(c.importe):f==='transferencia'?'Transferencia '+eur(c.importe):'Sin cobrar'; }

function pintarRepartidor(app, docs){
  var mios=ordenar(docs.filter(function(d){ return comDe(d)===String(S.miCom); }), String(S.miCom));
  var t=totalesDe(mios);
  var h='<div class="resumen"><div><b>'+t.hechas+'/'+t.n+'</b><span>entregas</span></div><div><b>'+num(t.efectivo)+'</b><span>€ efectivo</span></div><div><b>'+num(t.tarjeta)+'</b><span>€ tarjeta</span></div></div>';

// Firma a pantalla completa: el repartidor da la vuelta al móvil y el cliente firma con el dedo
var P=null;
function abrirPad(){
  var d=S.docs[F.k];
  var v=document.createElement('div'); v.className='pad'; v.id='pad';
  v.innerHTML='<div class="cab"><b>'+esc(d.cliente)+'</b><br>'+(d.tipo==='factura'?'Factura ':'Albarán ')+esc(d.num)+' · '+eur(d.total)+' · Firme con el dedo en la zona blanca</div>'+
    '<div class="area"><canvas id="lienzo"></canvas><div class="linea-firma"></div></div>'+
    '<div class="pie"><button class="btn" onclick="cerrarPad()">Cancelar</button><button class="btn" onclick="limpiarPad()">Borrar</button><button class="btn verde" onclick="aceptarPad()">✔ Listo</button></div>';
  document.body.appendChild(v);
  try{ if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function(){}); }catch(e){}
  setTimeout(iniciarLienzo,60);
  window.addEventListener('resize', reajustar);

function iniciarLienzo(){
  var c=document.getElementById('lienzo'); if(!c) return;
  var r=c.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  c.width=Math.round(r.width*dpr); c.height=Math.round(r.height*dpr);
  var x=c.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.lineWidth=2.6; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#111'; x.fillStyle='#111';
  P={c:c,x:x,trazos:[],actual:null};
  function pt(e){ var b=c.getBoundingClientRect(); return {x:e.clientX-b.left, y:e.clientY-b.top}; }
  c.onpointerdown=function(e){ e.preventDefault(); c.setPointerCapture(e.pointerId); var p=pt(e); P.actual=[p]; P.trazos.push(P.actual); x.beginPath(); x.arc(p.x,p.y,1.3,0,7); x.fill(); };
  c.onpointermove=function(e){ if(!P.actual) return; var p=pt(e), l=P.actual[P.actual.length-1]; x.beginPath(); x.moveTo(l.x,l.y); x.lineTo(p.x,p.y); x.stroke(); P.actual.push(p); };
  c.onpointerup=c.onpointercancel=function(){ P.actual=null; };
}
function redibujar(){ var c=P.c,x=P.x; x.clearRect(0,0,c.width,c.height); P.trazos.forEach(function(t){ x.beginPath(); t.forEach(function(p,i){ i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y); }); if(t.length===1){ x.arc(t[0].x,t[0].y,1.3,0,7); x.fill(); } else x.stroke(); }); }
function reajustar(){ if(!P) return; var t=P.trazos; iniciarLienzo(); if(P){ P.trazos=t; redibujar(); } }
function limpiarPad(){ if(P){ P.trazos=[]; redibujar(); } }
function cerrarPad(){ window.removeEventListener('resize', reajustar); var v=document.getElementById('pad'); if(v) v.remove(); P=null; try{ screen.orientation.unlock(); }catch(e){} }
function aceptarPad(){
  if(!P || !P.trazos.length){ toast('El cliente todavía no ha firmado'); return; }
  // Recorta la firma a lo dibujado y la guarda en PNG de 700 px como máximo
  var xs=[],ys=[]; P.trazos.forEach(function(t){ t.forEach(function(p){ xs.push(p.x); ys.push(p.y); }); });
  var m=12, x0=Math.max(0,Math.min.apply(null,xs)-m), y0=Math.max(0,Math.min.apply(null,ys)-m), x1=Math.max.apply(null,xs)+m, y1=Math.max.apply(null,ys)+m;
  var w=x1-x0, h=y1-y0, k=Math.min(1, 700/w, 300/h)*1.0; if(w<40||h<15){ k=1; }
  var o=document.createElement('canvas'); o.width=Math.max(1,Math.round(w*k)); o.height=Math.max(1,Math.round(h*k));
  var g=o.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,o.width,o.height); g.lineWidth=Math.max(1.6,2.6*k); g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#111'; g.fillStyle='#111';
  P.trazos.forEach(function(t){ g.beginPath(); t.forEach(function(p,i){ var X=(p.x-x0)*k, Y=(p.y-y0)*k; i?g.lineTo(X,Y):g.moveTo(X,Y); }); if(t.length===1){ g.arc((t[0].x-x0)*k,(t[0].y-y0)*k,1.5,0,7); g.fill(); } else g.stroke(); });
  F.firma=o.toDataURL('image/png');
  cerrarPad();
  var cj=document.getElementById('cajaFirma'); if(cj) cj.innerHTML='<img src="'+F.firma+'">';
}

    var url=URL.createObjectURL(blob); var w=window.open(url,'_blank'); if(!w){ var l=document.createElement('a'); l.href=url; l.download=nombre; document.body.appendChild(l); l.click(); setTimeout(function(){l.remove();},500); }

function pdfEntrega(k){

  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text('Fecha: '+d.fecha.split('-').reverse().join('/'),196,21,{align:'right'});
  doc.setFontSize(10); var y=32;
  [d.nombreFiscal||d.cliente, d.nif, d.direccion, d.poblacion].filter(Boolean).forEach(function(t){ doc.text(String(t),14,y); y+=5; });
  doc.autoTable({ startY:y+3, head:[['Artículo','Uds','Precio','%Dto','IVA %','Importe']],
    body:(d.lineas||[]).map(function(l){ return [l.d, num(l.u), num(l.p), l.dto?num(l.dto):'', num(l.iva), num(l.t)]; }),
    theme:'plain', styles:{fontSize:9,textColor:0,lineColor:150,lineWidth:0.1}, headStyles:{fontStyle:'bold',lineWidth:{bottom:0.3}},
    columnStyles:{1:{halign:'right'},2:{halign:'right'},3:{halign:'right'},4:{halign:'right'},5:{halign:'right'}} });
  y=doc.lastAutoTable.finalY+7;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.text('Total (IVA incluido): '+eur(d.total),196,y,{align:'right'}); y+=10;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);
  doc.text('Entregado el '+(e.hora||'').slice(0,10).split('-').reverse().join('/')+' a las '+(e.hora||'').slice(11,16)+(e.recibe?' · Recibe: '+e.recibe:''),14,y); y+=5;
  doc.text('Cobro: '+textoCobro(e.cobro),14,y); y+=4;
  if (e.firma){ try{ doc.text('Firma del cliente:',14,y+4); doc.addImage(e.firma,/png/.test(e.firma.slice(0,30))?'PNG':'JPEG',14,y+6,70,22); }catch(err){} }
  compartirPdf(doc, d.num+'_firmado.pdf', (d.tipo==='factura'?'Factura ':'Albarán ')+d.num);
}
function hojaRuta(c){
  var docs=ordenar(lista().filter(function(d){ return comDe(d)===c; }), c), doc=nuevoPdf(); if(!doc) return;
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text('Hoja de ruta · '+nombreRep(c),14,15);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.text(fechaLarga(S.fecha)+' · '+docs.length+' entregas · Rosas de Buscaflor',14,20);
  doc.autoTable({ startY:25, head:[['#','Cliente','Dirección','Teléfono','Documento','Total','Firma / cobro']],
    body:docs.map(function(d,i){ var en=entrega(d); return [i+1, d.cliente+(en.nombre?'\n'+en.nombre:''), [en.direccion,en.poblacion].filter(Boolean).join(', '), en.tel||'', d.num, eur(d.total), '']; }),
    theme:'grid', styles:{fontSize:8.5,textColor:0,lineColor:120,lineWidth:0.1,minCellHeight:12,valign:'middle'}, headStyles:{fillColor:false,fontStyle:'bold'},
    columnStyles:{0:{cellWidth:7},5:{halign:'right'},6:{cellWidth:32}} });
  var y=doc.lastAutoTable.finalY+6; doc.setFont('helvetica','bold'); doc.text('Total: '+eur(docs.reduce(function(s,d){return s+(+d.total||0);},0)),196,y,{align:'right'});
  compartirPdf(doc,'ruta_'+S.fecha+'_'+nombreRep(c).replace(/\s+/g,'-')+'.pdf','Hoja de ruta');
}

// ---------- menú ----------
function menu(){
  var h='<h3>'+esc(nombreYo())+'</h3><div class="fila-btn" style="flex-direction:column">'+
    '<button class="btn primario" onclick="elegirQuien()">👤 Cambiar de repartidor</button>'+
    (esOficina()?'<button class="btn" onclick="caja()">Caja del día por repartidor</button><a class="btn" style="text-align:center;text-decoration:none" href="pedidos.html">Ir a la app de pedidos</a>':'<button class="btn" onclick="pedirLectura();cerrarVelo()">↻ Pedir lectura de AmbarX</button>')+
    (esApp()?'':'<button class="btn" onclick="try{localStorage.removeItem(\'bf_rep_noinst\')}catch(e){};cerrarVelo();pintarInstalar()">📲 Instalar como app</button>')+
    '<button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function caja(){
  var docs=lista(), grupos={}; docs.forEach(function(d){ var c=comDe(d); (grupos[c]=grupos[c]||[]).push(d); });
  var filas=Object.keys(grupos).sort(function(a,b){return a-b;}).map(function(c){ var t=totalesDe(grupos[c]); return [nombreRep(c), t.hechas+'/'+t.n, t.efectivo, t.tarjeta, t.transferencia, t.pendiente]; });
  var tot=filas.reduce(function(s,f){ return [s[0],s[1],s[2]+f[2],s[3]+f[3],s[4]+f[4],s[5]+f[5]]; },['Total','',0,0,0,0]);
  var h='<h3>Caja · '+esc(fechaLarga(S.fecha))+'</h3><table><tr><th>Repartidor</th><th>Entr.</th><th>Efectivo</th><th>Tarjeta</th><th>Transf.</th><th>Sin cobrar</th></tr>'+
    filas.concat([tot]).map(function(f,i){ var b=i===filas.length; return '<tr>'+'<td class="txt">'+(b?'<b>':'')+esc(f[0])+(b?'</b>':'')+'</td><td>'+f[1]+'</td><td>'+num(f[2])+'</td><td>'+num(f[3])+'</td><td>'+num(f[4])+'</td><td>'+num(f[5])+'</td></tr>'; }).join('')+'</table>'+
    '<div class="nota">«Sin cobrar» suma lo entregado sin cobro. Lo no entregado no cuenta.</div><div class="fila-btn"><button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function verRepartidores(){
  var r=reps();
  var h='<h3>Repartidores</h3><div class="nota">El número es el «Comercial» de AmbarX. Cada repartidor entra con su móvil y un PIN de 6 cifras, y solo ve sus entregas. Los transportistas externos pueden tener acceso o usar la hoja de ruta en papel.</div>'+
    Object.keys(r).sort(function(a,b){return a-b;}).map(function(c){ var x=r[c]; return '<div class="card" style="border-left-color:var(--navy)"><b class="mono">'+esc(c)+'</b> · '+esc(x.nombre)+(x.externo?' <span class="tag">externo</span>':'')+(x.nave?' <span class="tag">nave</span>':'')+
      '<div class="nota">'+(x.email?'Entra con '+esc(x.movil||x.email)+(x.sinPin?' (sin PIN)':' + PIN'):'Sin acceso')+'</div>'+(!x.nave?'<button class="btn peq" onclick="editarRep(\''+c+'\')">'+(x.email?'Cambiar acceso':'Dar acceso')+'</button>':'')+'</div>'; }).join('')+
    '<div class="fila-btn"><button class="btn" onclick="cerrarVelo()">Cerrar</button></div>';
  velo(h);
}
function editarRep(c){
  var x=reps()[c];
  velo('<h3>Acceso de '+esc(x.nombre)+'</h3>'+(x.email?'<div class="nota">Ahora entra con '+esc(x.movil||x.email)+'</div>':'')+
    '<label>Móvil del repartidor</label><input id="rMov" type="tel" inputmode="numeric" placeholder="600123456" value="'+esc(x.movil||'')+'">'+
    '<label>PIN de 6 cifras (opcional)</label><input id="rPin" type="tel" inputmode="numeric" maxlength="6" placeholder="Déjalo vacío para entrar solo con el móvil" autocomplete="off">'+
    '<div class="nota">Sin PIN, el repartidor entra solo con su número de móvil (para la prueba). Con PIN, tendrá que escribirlo la primera vez.</div>'+
    '<div class="fila-btn"><button class="btn primario" onclick="guardarRep(\''+c+'\')">Dar acceso</button><button class="btn" onclick="verRepartidores()">Volver</button></div>'+
    (x.email?'<div class="fila-btn"><button class="btn peligro" onclick="quitarRep(\''+c+'\')">Quitar acceso</button></div>':''));
}
function guardarRep(c){
  var mov=soloMovil(document.getElementById('rMov').value), pin=document.getElementById('rPin').value.trim();
  if(!mov){ toast('Pon un móvil español de 9 cifras'); return; }
  if(pin && !/^\d{6}$/.test(pin)){ toast('El PIN tiene que ser de 6 cifras (o déjalo vacío)'); return; }
  if(pin && /^(\d)\1{5}$|^123456$|^654321$/.test(pin)){ toast('Ese PIN es demasiado fácil'); return; }
  var clave = pin || claveSinPin(mov), yaTenia=false;
  var em=mov+DOM_REP;
  // Crea la cuenta con una segunda conexión para no cerrar la sesión de la oficina
  var app2 = firebase.apps.find(function(a){ return a.name==='alta'; }) || firebase.initializeApp(CFG,'alta');
  app2.auth().createUserWithEmailAndPassword(em, clave).then(function(){ return app2.auth().signOut(); })
    .catch(function(e){ if(e.code==='auth/email-already-in-use'){ yaTenia=true; return; } throw e; })
    .then(function(){ return db.ref('buscaflor/configPedidos/repartidores/'+c).update({ email: em, movil: mov, sinPin: !pin, nombre: reps()[c].nombre }); })
    .then(function(){ toast(yaTenia?'Ese móvil ya tenía cuenta: entra como la primera vez (con su PIN si se lo pusiste)':'Acceso creado: '+mov); verRepartidores(); }, function(e){ toast(e.message||String(e)); });
}
function quitarRep(c){
  if(!confirm('¿Quitar el acceso a '+reps()[c].nombre+'? Dejará de ver sus entregas.')) return;
  db.ref('buscaflor/configPedidos/repartidores/'+c).update({ email: null, movil: null }).then(function(){ toast('Acceso quitado'); verRepartidores(); });
}

// ---------- app instalable ----------
var promptInstalar=null;
function esApp(){ return (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
function esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1); }
function pintarInstalar(){
  var b=document.getElementById('bInstalar'), l=document.getElementById('bInstalarLogin');
  var ocultar=esApp() || (function(){ try{ return localStorage.getItem('bf_rep_noinst')==='1'; }catch(e){ return false; } })();
  if (ocultar){ b.style.display='none'; if(l) l.innerHTML=''; return; }
  var txt, btn='';
  if (promptInstalar){ txt='<b>Instala la app de Reparto</b><br>Tendrás el icono en el móvil y se abre a pantalla completa.'; btn='<button class="btn primario peq" onclick="instalar()">Instalar</button>'; }
  else if (esIOS()){ txt='<b>Ponla como app:</b> pulsa <b>Compartir</b> <span style="font-size:15px">⎋</span> y luego <b>«Añadir a pantalla de inicio»</b>.'; }
  else { txt='<b>Ponla como app:</b> en el menú ⋮ del navegador, pulsa <b>«Instalar app»</b> o <b>«Añadir a pantalla de inicio»</b>.'; }
  b.innerHTML='<img src="icons/reparto-192.png" alt=""><div class="t">'+txt+'</div>'+btn+'<button class="btn peq" onclick="noInstalar()" aria-label="Cerrar">✕</button>';
  b.style.display='flex';
  if(l) l.innerHTML = promptInstalar ? '<a href="#" onclick="instalar();return false">📲 Instalar la app en este móvil</a>' : (esIOS()?'📲 Para tenerla como app: Compartir › «Añadir a pantalla de inicio»':'');
}
function instalar(){ if(!promptInstalar) return; promptInstalar.prompt(); promptInstalar.userChoice.then(function(){ promptInstalar=null; pintarInstalar(); }); }
function noInstalar(){ try{ localStorage.setItem('bf_rep_noinst','1'); }catch(e){} pintarInstalar(); }
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); promptInstalar=e; pintarInstalar(); });
window.addEventListener('appinstalled', function(){ promptInstalar=null; pintarInstalar(); toast('App instalada'); });
if ('serviceWorker' in navigator) { window.addEventListener('load', function(){ navigator.serviceWorker.register('sw-reparto.js', { scope: './reparto' }).catch(function(){}); }); }
setTimeout(pintarInstalar, 300);

// ---------- arranque ----------
document.getElementById('fAnt').onclick=function(){ moverDia(-1); };
document.getElementById('fSig').onclick=function(){ moverDia(1); };
document.getElementById('fHoy').onclick=function(){ S.fecha=hoyISO(); escuchar(); };
document.getElementById('bMenu').onclick=menu;

// Pantalla «¿Quién eres?»
function elegirQuien(){
  var r=reps();
  var h='<h3>¿Quién eres?</h3><div class="nota">Elige tu nombre para ver tus entregas. El móvil lo recordará.</div><div class="fila-btn" style="flex-direction:column">'+
    Object.keys(r).filter(function(c){ return !r[c].nave; }).sort(function(a,b){return a-b;}).map(function(c){
      return '<button class="btn'+(quien()===c?' primario':'')+'" style="padding:15px;font-size:16px" onclick="ponerQuien(\''+c+'\')">🚚 '+esc(r[c].nombre)+'</button>'; }).join('')+
    '<button class="btn'+(quien()==='oficina'?' primario':'')+'" style="padding:15px;font-size:16px" onclick="ponerQuien(\'oficina\')">🏢 Oficina (ver todos)</button></div>';
  velo(h);
  var v=document.getElementById('velo'); if(v) v.onclick=null; // no se cierra tocando fuera
}
function ponerQuien(c){
  try{ localStorage.setItem('bf_rep_quien', c); }catch(e){}
  aplicarQuien(); cerrarVelo();
}
function aplicarQuien(){
  var q=quien();
  S.miCom = (q && q!=='oficina') ? q : null; S.bloqueado=false;
  document.getElementById('titulo').textContent = esOficina() ? 'Reparto · Oficina' : 'Reparto · '+nombreRep(S.miCom);
}

document.getElementById('bfLogin').style.display='none';
db.ref('buscaflor/configPedidos/direccionesReparto').on('value', function(s){ S.dirs=s.val()||{}; pintar(); });
var primeraVez=true;
db.ref('buscaflor/configPedidos/repartidores').on('value', function(s){
  S.rep=s.val()||{}; aplicarQuien(); pintar();
  if(primeraVez){ primeraVez=false; if(!quien()) elegirQuien(); }
});
escuchar();
</script>
